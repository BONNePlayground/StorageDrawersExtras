plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

base {
    archivesName = "${file_name}-forge-${minecraft_version}"
}

mixin {
    config("${mod_id}.mixins.json")
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true //Calls processResources when in dev

    reobf = false // Forge 1.20.6+ uses official mappings at runtime, so we shouldn't reobf from official to SRG

    runs {
        // applies to all the run configs below
        configureEach {
            ideaModule "${rootProject.name}.${project.name}.main"

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory file('run/client')
            taskName 'Client'
        }

        server {
            workingDirectory file('run/server')
            taskName 'Server'
        }

        data {
            workingDirectory file('run/data')
            args '--mod', mod_id, '--client', '--server', '--output', file('src/generated/resources/'), '--existing', file("src/main/resources")
            taskName 'Data'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    implementation "curse.maven:storagedrawers-223852:${forge_storagedrawers}"

    implementation "curse.maven:biomes-o-plenty-220318:${forge_biomesoplenty}"
    implementation "curse.maven:glitchcore-955399:${forge_glitchcore}"
    implementation "curse.maven:terrablender-563928:${forge_terrablender}"

    implementation "curse.maven:oh-the-biomes-weve-gone-1070751:${forge_ohthebiomeswevegone}"
    implementation "curse.maven:oh-the-trees-youll-grow-962544:${forge_ohthetreesyoullgrow}"
    implementation "curse.maven:corgilib-693313:${forge_corgilib}"
    implementation "curse.maven:geckolib-388172:${forge_geckolib}"

    implementation "curse.maven:jei-238222:${forge_jei}"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

