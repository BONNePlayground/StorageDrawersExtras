modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
issueTrackerURL="https://github.com/BONNePlayground/StorageDrawersExtras/issues"
displayURL="https://www.curseforge.com/minecraft/mc-mods/storage-drawers-extra-reloaded"
license="${license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    logoFile="icon.png"
    credits="${credits}"
    authors = "${mod_author}"
    description = '''${description}'''
[[mixins]]
    config = "${mod_id}.mixins.json"
[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type="required"
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type="required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId="storagedrawers"
    mandatory=true
    versionRange="${storagedrawers_range}"
    ordering="BEFORE"
    side="BOTH"

## Content Dependencies

[[dependencies."${mod_id}"]]
    modId="biomesoplenty"
    mandatory=false
    type="optional"
    versionRange="1.21.1-18.0.0.0,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="biomeswevegone"
    mandatory=false
    type="optional"
    versionRange="1.0.0,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies."${mod_id}"]]
    modId="immersiveengineering"
    mandatory=false
    type="optional"
    versionRange="1.0.0,)"
    ordering="BEFORE"
    side="BOTH"